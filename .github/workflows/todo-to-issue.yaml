name: Run TODO to Issue

on:
  push:
    branches:
      - trunk

jobs:
  run-todo-to-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: TODO to Issue
        uses: alstr/todo-to-issue-action@v5
        with:
          IGNORE: "^vendor/.*,node_modules/"
