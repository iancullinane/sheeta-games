# ─────────────────────────────────────────────────────────────────────────────
# EXTERNAL SECRET — "keep a Kubernetes Secret in sync with this AWS secret."
#
# ESO reconciles this object on a loop: it fetches the RDS credentials from the
# ClusterSecretStore (Secrets Manager), assembles a DATABASE_URL, and writes it into
# a k8s Secret named `prisoner-db` in this namespace. The app (Step 2e) then mounts
# that Secret as the DATABASE_URL env var — the AWS secret is never baked into any
# manifest or image.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prisoner-db
  # the resulting k8s Secret is created HERE, alongside the app Pods
  namespace: prisoner
spec:
  # how often ESO re-pulls from AWS (it also reacts immediately to spec changes).
  # Short enough to pick up a credential rotation without being chatty.
  refreshInterval: 1h
  # which store to read from — the ClusterSecretStore in secretstore.yaml
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    # the k8s Secret ESO creates and manages (its name, in this namespace)
    name: prisoner-db
    # Owner = ESO fully owns this Secret's lifecycle (creates it, and deletes it if
    # this ExternalSecret is removed). Other modes: Merge (into an existing Secret),
    # Orphan (leave it behind on delete).
    creationPolicy: Owner
    template:
      # v2 templating: build our own key(s) from the fetched fields rather than
      # copying the raw AWS JSON. Here we assemble a single DATABASE_URL.
      engineVersion: v2
      data:
        # pgx accepts this URL DSN. Fields come from the RDS secret's JSON
        # (username/password/host/port/dbname). sslmode=require because RDS wants TLS.
        DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}?sslmode=require"
  # WHAT to fetch: extract all JSON key/value pairs from the RDS secret so the
  # template above can reference {{ .username }} etc.
  dataFrom:
    - extract:
        # The RDS secret has an auto-generated NAME, so we reference it by ARN, which
        # is stable. FILL THIS IN from the DatabaseStack `DbSecretArn` output:
        #   aws cloudformation describe-stacks --stack-name DatabaseStack \
        #     --query "Stacks[0].Outputs[?OutputKey=='DbSecretArn'].OutputValue" --output text
        key: arn:aws:secretsmanager:us-east-2:346096930733:secret:DatabaseStackInstanceSecret-sfOyQZXVUbk6-PGKmLd
