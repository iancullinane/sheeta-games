# ─────────────────────────────────────────────────────────────────────────────
# CLUSTER SECRET STORE — the "source" External Secrets Operator reads from.
#
# ESO (installed via CDK, Step 2d) introduces two custom resources:
#   - a SecretStore / ClusterSecretStore: WHERE to read secrets from (a provider).
#   - an ExternalSecret: WHAT to read and WHICH k8s Secret to keep in sync.
#
# ClusterSecretStore is CLUSTER-scoped (a plain SecretStore is namespaced). We use
# the cluster-scoped one so it's defined once and any namespace's ExternalSecret can
# reference it. Both kinds are CRDs shipped by ESO's installCRDs.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  # the name an ExternalSecret references via secretStoreRef.name
  name: aws-secretsmanager
spec:
  provider:
    aws:
      # which AWS secret backend — Secrets Manager (vs SSM ParameterStore). The RDS
      # credentials secret lives in Secrets Manager.
      service: SecretsManager
      # Secrets Manager is regional — point at the region the secret lives in.
      region: us-east-2
      auth:
        # IRSA — the "+ IRSA" half of Step 2d. ESO mints a projected token for THIS
        # ServiceAccount and calls sts:AssumeRoleWithWebIdentity to become the IAM
        # role CDK bound to it (scoped to read ONLY the RDS secret). No static keys.
        jwt:
          serviceAccountRef:
            # the IRSA ServiceAccount created in platform.ts (addServiceAccount)
            name: external-secrets
            namespace: kube-system
